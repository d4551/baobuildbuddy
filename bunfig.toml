[install]
peer = false

# Repo-root `bun test` discovers packages/server tests without packages/server/bunfig.toml; mirror the
# server preload so auth/DB env matches `bun run --cwd packages/server test`. CI uses `bun run test`.
# pathIgnorePatterns: Bun 1.4+ prunes Tauri target/ trees (optional when stale bundles exist locally).
[test]
preload = ["./packages/server/src/test-setup.ts"]
smol = true
# Serialize tests at repo root so server tests that patch globalThis.fetch are not interleaved with scraper.
concurrent = 1
pathIgnorePatterns = [
  "**/packages/desktop/src-tauri/target/**",
  "**/packages/server/dist/**",
  # Client `*.spec.ts` files are vitest-owned: they need the happy-dom
  # environment declared in packages/client/vitest.config.ts, which `bun test`
  # cannot provide. They run in full via `bun run --cwd packages/client test`
  # (part of `bun run test`). Collecting them here would fail on a missing DOM
  # rather than on anything real. `validate-dom-test-runner-ownership.ts` keeps
  # the naming split honest so no DOM test can hide from either runner.
  "**/packages/client/**/*.spec.ts",
]
