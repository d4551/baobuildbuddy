name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
      - "copilot/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Get Bun version from package.json
        id: bun-version
        shell: bash
        run: echo "version=$(bash scripts/read-bun-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}

      - name: Setup Rust (Tauri cargo check in lint)
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Install Linux Tauri deps (cargo check in lint)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            pkg-config \
            libssl-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install workspace dependencies
        run: bun ci

      - name: Install Playwright Chromium
        run: bun run automation:browsers:install

      - name: Run lint
        timeout-minutes: 20
        run: bun run lint

      - name: Run tests
        timeout-minutes: 20
        run: bun run test

      - name: Build production bundles
        timeout-minutes: 25
        run: bun run build:verify

      - name: Verify SSR routes
        timeout-minutes: 10
        run: bun run verify:pages
