name: desktop-release

on:
  push:
    branches:
      - main
      - "codex/**"
      - "copilot/**"
  workflow_dispatch:
    inputs:
      include_linux_appimage:
        default: true
        description: "Include Linux AppImage on x64 builds"
        required: false
        type: boolean
      include_linux_signatures:
        default: true
        description: "Generate detached GPG signatures for Linux artifacts"
        required: false
        type: boolean
      include_windows_msi:
        default: true
        description: "Include Windows MSI in addition to NSIS and portable"
        required: false
        type: boolean
      macos_architectures:
        description: "Optional comma-separated macOS architectures (aarch64,x86_64,universal)"
        required: false
        type: string

concurrency:
  group: desktop-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DESKTOP_RELEASE_LINUX_APPIMAGE: ${{ github.event_name != 'workflow_dispatch' && vars.DESKTOP_RELEASE_LINUX_APPIMAGE || github.event.inputs.include_linux_appimage }}
  # workflow_dispatch: must honor boolean `false` (do not use `input || vars` — false is falsy and would fall through to vars).
  # push: use repository vars when set; otherwise leave empty so scripts apply defaults.
  DESKTOP_RELEASE_LINUX_SIGNATURES: ${{ github.event_name != 'workflow_dispatch' && vars.DESKTOP_RELEASE_LINUX_SIGNATURES || github.event.inputs.include_linux_signatures }}
  DESKTOP_RELEASE_MACOS_ARCHITECTURES: ${{ github.event.inputs.macos_architectures || vars.DESKTOP_RELEASE_MACOS_ARCHITECTURES }}
  DESKTOP_RELEASE_WINDOWS_MSI: ${{ github.event_name != 'workflow_dispatch' && vars.DESKTOP_RELEASE_WINDOWS_MSI || github.event.inputs.include_windows_msi }}

jobs:
  quality-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Get Bun version from package.json
        id: bun-version
        shell: bash
        run: echo "version=$(bash scripts/read-bun-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}

      - name: Install workspace dependencies
        run: bun ci

      - name: Install Playwright Chromium
        run: bun run automation:browsers:install

      - name: Run lint
        run: bun run lint

      - name: Run typecheck
        run: bun run typecheck

      # Uses package.json (workspace filters + scripts/*.test.ts). Do not replace with bare `bun test`
      # at repo root without bunfig pathIgnorePatterns — Tauri target/ can contain copied tests.
      - name: Run tests
        run: bun run test

      - name: Run SSR build
        run: bun run build

  build-macos:
    needs: quality-gates
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Evaluate Apple signing and notarization gates
        id: apple
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          has_codesign=false
          if [ -n "${APPLE_CERTIFICATE}" ] && [ -n "${APPLE_CERTIFICATE_PASSWORD}" ] && \
             [ -n "${KEYCHAIN_PASSWORD}" ] && [ -n "${APPLE_SIGNING_IDENTITY}" ]; then
            has_codesign=true
          fi
          full_notarize=false
          if [ "${has_codesign}" = true ] && [ -n "${APPLE_API_KEY_CONTENT}" ] && \
             [ -n "${APPLE_API_ISSUER}" ] && [ -n "${APPLE_API_KEY}" ]; then
            full_notarize=true
          fi
          echo "has_codesign=${has_codesign}" >> "${GITHUB_OUTPUT}"
          echo "full_notarize=${full_notarize}" >> "${GITHUB_OUTPUT}"

      - name: Get Bun version from package.json
        id: bun-version
        shell: bash
        run: echo "version=$(bash scripts/read-bun-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
          cache-on-failure: true

      - name: Install workspace dependencies
        run: bun ci

      - name: Install Playwright Chromium
        run: bun run automation:browsers:install

      - name: Import Apple developer certificate
        if: ${{ steps.apple.outputs.has_codesign == 'true' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Prepare App Store Connect API key
        if: ${{ steps.apple.outputs.full_notarize == 'true' }}
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf "%s" "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY_PATH"
          chmod 600 "$APPLE_API_KEY_PATH"
          echo "APPLE_API_KEY_PATH=$APPLE_API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Export Apple signing identity for Tauri
        if: ${{ steps.apple.outputs.has_codesign == 'true' }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: echo "APPLE_SIGNING_IDENTITY=${APPLE_SIGNING_IDENTITY}" >> "$GITHUB_ENV"

      - name: Export Apple notarization API environment for Tauri
        if: ${{ steps.apple.outputs.full_notarize == 'true' }}
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          echo "APPLE_API_ISSUER=${APPLE_API_ISSUER}" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=${APPLE_API_KEY}" >> "$GITHUB_ENV"

      - name: Build native macOS release artifacts (notarized)
        if: ${{ steps.apple.outputs.full_notarize == 'true' }}
        run: bun run release:desktop:macos -- --output-root .desktop-release-artifacts --release --no-sync-release-dir

      - name: Build native macOS release artifacts (ad-hoc signed)
        if: ${{ steps.apple.outputs.full_notarize != 'true' }}
        env:
          DESKTOP_RELEASE_RELEASE_MODE: "false"
        run: bun run release:desktop:macos -- --output-root .desktop-release-artifacts --no-sync-release-dir

      - name: Verify packaged desktop runtime
        run: bun run verify:desktop-runtime -- --target aarch64-apple-darwin

      # Stapler + verify --release require a stapled notarization ticket. Skip when Apple API / signing
      # secrets are absent so forks and partial secret sets still produce signed or ad-hoc DMGs.
      - name: Validate notarized macOS artifacts
        if: ${{ steps.apple.outputs.full_notarize == 'true' }}
        run: |
          find .desktop-release-artifacts/macos -name '*.dmg' -print0 | while IFS= read -r -d '' artifact; do
            xcrun stapler validate -v "$artifact"
          done

      - name: Verify macOS release artifacts (stapled shipping build)
        if: ${{ steps.apple.outputs.full_notarize == 'true' }}
        run: bun run verify:desktop-releases -- --targets macos --release

      - name: Verify macOS release artifacts (non-stapled CI)
        if: ${{ steps.apple.outputs.full_notarize != 'true' }}
        env:
          DESKTOP_RELEASE_RELEASE_MODE: "false"
        run: bun run verify:desktop-releases -- --targets macos

      - name: List staged macOS release files
        run: find .desktop-release-artifacts/macos -type f -print

      - name: Upload macOS release artifact set
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-macos
          path: .desktop-release-artifacts/macos
          if-no-files-found: error

  build-windows:
    needs: quality-gates
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
      WINDOWS_DIGEST_ALGORITHM: ${{ secrets.WINDOWS_DIGEST_ALGORITHM }}
      WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Get Bun version from package.json
        id: bun-version
        shell: bash
        run: echo "version=$(bash scripts/read-bun-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
          cache-on-failure: true

      - name: Install workspace dependencies
        shell: pwsh
        run: bun ci

      - name: Install Playwright Chromium
        shell: pwsh
        run: bun run automation:browsers:install

      - name: Download WebView2 bootstrapper
        shell: pwsh
        run: |
          $bootstrapperDir = Join-Path $env:LOCALAPPDATA 'tauri'
          $bootstrapperPath = Join-Path $bootstrapperDir 'MicrosoftEdgeWebview2Setup.exe'
          New-Item -ItemType Directory -Force -Path $bootstrapperDir | Out-Null
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $bootstrapperPath
          if (!(Test-Path $bootstrapperPath)) {
            throw "WebView2 bootstrapper download did not produce $bootstrapperPath"
          }

      - name: Install WiX Toolset for MSI bundles
        if: ${{ env.DESKTOP_RELEASE_WINDOWS_MSI != 'false' }}
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress -y
          $wixRoots = @(
            'C:\Program Files (x86)\WiX Toolset v3.14\bin',
            'C:\Program Files (x86)\WiX Toolset v3.11\bin'
          )
          foreach ($root in $wixRoots) {
            if (Test-Path $root) {
              Add-Content -Path $env:GITHUB_PATH -Value $root
              break
            }
          }

      - name: Verify WiX tools on PATH
        if: ${{ env.DESKTOP_RELEASE_WINDOWS_MSI != 'false' }}
        shell: pwsh
        run: |
          if (-not (Get-Command candle -ErrorAction SilentlyContinue)) { throw 'WiX candle.exe not on PATH' }
          if (-not (Get-Command light -ErrorAction SilentlyContinue)) { throw 'WiX light.exe not on PATH' }

      - name: Import Windows code-signing certificate
        if: ${{ env.WINDOWS_CERTIFICATE != '' && env.WINDOWS_CERTIFICATE_PASSWORD != '' }}
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'desktop-signing-cert.pfx'
          [System.IO.File]::WriteAllBytes($certificatePath, [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force) | Out-Null

      - name: Build native Windows release artifacts
        shell: pwsh
        run: bun run release:desktop:windows -- --output-root .desktop-release-artifacts --release --no-sync-release-dir

      - name: Verify packaged desktop runtime
        shell: pwsh
        run: bun run verify:desktop-runtime -- --target x86_64-pc-windows-msvc

      - name: Verify Windows release artifacts
        shell: pwsh
        run: bun run verify:desktop-releases -- --targets windows --release

      - name: List staged Windows release files
        shell: pwsh
        run: Get-ChildItem -Recurse .desktop-release-artifacts/windows | ForEach-Object { $_.FullName }

      - name: Upload Windows release artifact set
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-windows
          path: .desktop-release-artifacts/windows
          if-no-files-found: error

  build-linux-x64:
    needs: quality-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DESKTOP_RELEASE_GPG_KEY_ID: ${{ secrets.DESKTOP_RELEASE_GPG_KEY_ID }}
      DESKTOP_RELEASE_GPG_PASSPHRASE: ${{ secrets.DESKTOP_RELEASE_GPG_PASSPHRASE }}
      DESKTOP_GPG_PRIVATE_KEY: ${{ secrets.DESKTOP_GPG_PRIVATE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Disable Linux detached signatures without GPG secrets
        if: ${{ env.DESKTOP_GPG_PRIVATE_KEY == '' || env.DESKTOP_RELEASE_GPG_KEY_ID == '' }}
        run: echo "DESKTOP_RELEASE_LINUX_SIGNATURES=false" >> "$GITHUB_ENV"

      - name: Get Bun version from package.json
        id: bun-version
        shell: bash
        run: echo "version=$(bash scripts/read-bun-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
          cache-on-failure: true

      - name: Install Linux bundle dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            cpio \
            rpm \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            squashfs-tools \
            libfuse2

      - name: Install workspace dependencies
        run: bun ci

      - name: Install Playwright Chromium
        run: bun run automation:browsers:install

      - name: Import Linux release signing key
        if: ${{ env.DESKTOP_RELEASE_LINUX_SIGNATURES == 'true' && env.DESKTOP_GPG_PRIVATE_KEY != '' }}
        run: |
          echo "$DESKTOP_GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import

      - name: Build native Linux x64 release artifacts
        run: bun run release:desktop:linux-x64 -- --output-root .desktop-release-artifacts --verbose --release --no-sync-release-dir

      - name: Verify packaged desktop runtime
        run: bun run verify:desktop-runtime -- --target x86_64-unknown-linux-gnu

      - name: Verify Linux x64 release artifacts
        run: bun run verify:desktop-releases -- --targets linux-x64 --release

      - name: Require AppImage when enabled
        if: ${{ env.DESKTOP_RELEASE_LINUX_APPIMAGE == 'true' }}
        run: |
          set -euo pipefail
          appimages="$(find .desktop-release-artifacts/linux-x64 -maxdepth 1 -type f -name '*.AppImage' 2>/dev/null || true)"
          if [ -z "$appimages" ]; then
            echo "::error::Expected at least one *.AppImage under .desktop-release-artifacts/linux-x64 (DESKTOP_RELEASE_LINUX_APPIMAGE is 'true')."
            find .desktop-release-artifacts/linux-x64 -type f -print || true
            exit 1
          fi
          echo "AppImage outputs:"
          echo "$appimages"

      - name: List staged Linux x64 release files
        run: find .desktop-release-artifacts/linux-x64 -type f -print

      - name: Upload Linux x64 release artifact set
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-linux-x64
          path: .desktop-release-artifacts/linux-x64
          if-no-files-found: error

  build-linux-arm64:
    needs: quality-gates
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      DESKTOP_RELEASE_GPG_KEY_ID: ${{ secrets.DESKTOP_RELEASE_GPG_KEY_ID }}
      DESKTOP_RELEASE_GPG_PASSPHRASE: ${{ secrets.DESKTOP_RELEASE_GPG_PASSPHRASE }}
      DESKTOP_GPG_PRIVATE_KEY: ${{ secrets.DESKTOP_GPG_PRIVATE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Disable Linux detached signatures without GPG secrets
        if: ${{ env.DESKTOP_GPG_PRIVATE_KEY == '' || env.DESKTOP_RELEASE_GPG_KEY_ID == '' }}
        run: echo "DESKTOP_RELEASE_LINUX_SIGNATURES=false" >> "$GITHUB_ENV"

      - name: Get Bun version from package.json
        id: bun-version
        shell: bash
        run: echo "version=$(bash scripts/read-bun-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
          cache-on-failure: true

      - name: Install Linux bundle dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            cpio \
            rpm \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install workspace dependencies
        run: bun ci

      - name: Install Playwright Chromium
        run: bun run automation:browsers:install

      - name: Import Linux release signing key
        if: ${{ env.DESKTOP_RELEASE_LINUX_SIGNATURES == 'true' && env.DESKTOP_GPG_PRIVATE_KEY != '' }}
        run: |
          echo "$DESKTOP_GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import

      - name: Build native Linux ARM64 release artifacts
        run: bun run release:desktop:linux-arm64 -- --output-root .desktop-release-artifacts --verbose --release --no-sync-release-dir

      - name: Verify packaged desktop runtime
        run: bun run verify:desktop-runtime -- --target aarch64-unknown-linux-gnu

      - name: Verify Linux ARM64 release artifacts
        run: bun run verify:desktop-releases -- --targets linux-arm64 --release

      - name: List staged Linux ARM64 release files
        run: find .desktop-release-artifacts/linux-arm64 -type f -print

      - name: Upload Linux ARM64 release artifact set
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-linux-arm64
          path: .desktop-release-artifacts/linux-arm64
          if-no-files-found: error

  assemble-release:
    needs:
      - build-macos
      - build-windows
      - build-linux-x64
      - build-linux-arm64
    runs-on: macos-14
    timeout-minutes: 45
    env:
      DESKTOP_GPG_PRIVATE_KEY: ${{ secrets.DESKTOP_GPG_PRIVATE_KEY }}
      DESKTOP_RELEASE_GPG_KEY_ID: ${{ secrets.DESKTOP_RELEASE_GPG_KEY_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Evaluate Apple signing and notarization gates
        id: apple
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          has_codesign=false
          if [ -n "${APPLE_CERTIFICATE}" ] && [ -n "${APPLE_CERTIFICATE_PASSWORD}" ] && \
             [ -n "${KEYCHAIN_PASSWORD}" ] && [ -n "${APPLE_SIGNING_IDENTITY}" ]; then
            has_codesign=true
          fi
          full_notarize=false
          if [ "${has_codesign}" = true ] && [ -n "${APPLE_API_KEY_CONTENT}" ] && \
             [ -n "${APPLE_API_ISSUER}" ] && [ -n "${APPLE_API_KEY}" ]; then
            full_notarize=true
          fi
          echo "has_codesign=${has_codesign}" >> "${GITHUB_OUTPUT}"
          echo "full_notarize=${full_notarize}" >> "${GITHUB_OUTPUT}"

      - name: Disable Linux detached signatures without GPG secrets
        if: ${{ env.DESKTOP_GPG_PRIVATE_KEY == '' || env.DESKTOP_RELEASE_GPG_KEY_ID == '' }}
        run: echo "DESKTOP_RELEASE_LINUX_SIGNATURES=false" >> "$GITHUB_ENV"

      - name: Get Bun version from package.json
        id: bun-version
        shell: bash
        run: echo "version=$(bash scripts/read-bun-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}

      - name: Install workspace dependencies
        run: bun ci

      - name: Install desktop package inspection tools
        run: brew install dpkg rpm

      - name: Download macOS release artifact set
        uses: actions/download-artifact@v8
        with:
          name: desktop-release-macos
          path: .desktop-release-input/macos

      - name: Download Windows release artifact set
        uses: actions/download-artifact@v8
        with:
          name: desktop-release-windows
          path: .desktop-release-input/windows

      - name: Download Linux x64 release artifact set
        uses: actions/download-artifact@v8
        with:
          name: desktop-release-linux-x64
          path: .desktop-release-input/linux-x64

      - name: Download Linux ARM64 release artifact set
        uses: actions/download-artifact@v8
        with:
          name: desktop-release-linux-arm64
          path: .desktop-release-input/linux-arm64

      - name: Assemble canonical desktop release directory
        run: bun run release:refresh:all-os -- --source-root .desktop-release-input --targets macos,windows,linux-x64,linux-arm64

      - name: Verify assembled desktop releases (expect stapled macOS DMG)
        if: ${{ steps.apple.outputs.full_notarize == 'true' }}
        run: bun run verify:desktop-releases -- --targets macos,windows,linux-x64,linux-arm64 --release

      - name: Verify assembled desktop releases (skip macOS stapler)
        if: ${{ steps.apple.outputs.full_notarize != 'true' }}
        env:
          DESKTOP_RELEASE_RELEASE_MODE: "false"
        run: bun run verify:desktop-releases -- --targets macos,windows,linux-x64,linux-arm64

      - name: List assembled desktop release files
        run: find packages/desktop/releases -type f ! -path '*/.git/*' -print

      - name: Upload assembled desktop releases
        uses: actions/upload-artifact@v7
        with:
          name: desktop-releases
          path: packages/desktop/releases
          if-no-files-found: error
