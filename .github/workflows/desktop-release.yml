name: desktop-release

on:
  push:
    branches:
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
          cache-on-failure: true

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build native macOS release artifacts
        run: bun run release:desktop:macos -- --output-root .desktop-release-artifacts

      - name: Upload macOS release artifact set
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-macos
          path: .desktop-release-artifacts/macos
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
          cache-on-failure: true

      - name: Install workspace dependencies
        shell: pwsh
        run: bun install --frozen-lockfile

      - name: Build native Windows release artifacts
        shell: pwsh
        run: bun run release:desktop:windows -- --output-root .desktop-release-artifacts

      - name: Upload Windows release artifact set
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-windows
          path: .desktop-release-artifacts/windows
          if-no-files-found: error

  build-linux-arm64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build native Linux ARM64 release artifacts
        uses: pguyot/arm-runner-action@v2.6.5
        with:
          base_image: https://dietpi.com/downloads/images/DietPi_RPi5-ARMv8-Bookworm.img.xz
          cpu: cortex-a72
          bind_mount_repository: true
          image_additional_mb: 10240
          optimize_image: no
          commands: |
            export HOME=/root
            export CARGO_REGISTRIES_CRATES_IO_PROTOCOL=sparse
            apt-get update -y --allow-releaseinfo-change
            apt-get autoremove -y
            apt-get install -y --no-install-recommends --no-install-suggests \
              curl \
              file \
              build-essential \
              libwebkit2gtk-4.1-dev \
              libgtk-3-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev \
              patchelf \
              libfuse2
            curl -fsSL https://bun.sh/install | bash
            export BUN_INSTALL=/root/.bun
            export PATH="$BUN_INSTALL/bin:$PATH"
            curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal --default-toolchain stable
            . "$HOME/.cargo/env"
            rustup target add aarch64-unknown-linux-gnu
            bun install --frozen-lockfile
            bun run release:desktop:linux-arm64 -- --output-root .desktop-release-artifacts

      - name: Upload Linux ARM64 release artifact set
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-linux
          path: .desktop-release-artifacts/linux
          if-no-files-found: error

  assemble-release:
    needs:
      - build-macos
      - build-windows
      - build-linux-arm64
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Download macOS release artifact set
        uses: actions/download-artifact@v4
        with:
          name: desktop-release-macos
          path: .desktop-release-input/macos

      - name: Download Windows release artifact set
        uses: actions/download-artifact@v4
        with:
          name: desktop-release-windows
          path: .desktop-release-input/windows

      - name: Download Linux release artifact set
        uses: actions/download-artifact@v4
        with:
          name: desktop-release-linux
          path: .desktop-release-input/linux

      - name: Assemble canonical desktop release directory
        run: bun run release:refresh:all-os -- --source-root .desktop-release-input

      - name: Upload assembled desktop releases
        uses: actions/upload-artifact@v4
        with:
          name: desktop-releases
          path: packages/desktop/releases
          if-no-files-found: error
